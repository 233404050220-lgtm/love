<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anh có yêu em không? 💗</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(145deg, #ffe4ef, #ffd1e3 55%, #fff1f7); overflow: hidden; color: #a82c64; }
    .card { position: relative; width: min(100%, 520px); text-align: center; padding: 56px 20px; border-radius: 30px; background: rgba(255,255,255,.82); box-shadow: 0 16px 50px rgba(195,57,112,.17); z-index: 1; }
    .heart { font-size: 60px; margin-bottom: 12px; animation: beat 1.3s infinite; }
    h1 { font-size: clamp(27px, 6vw, 40px); margin: 0 0 35px; line-height: 1.3; }
    .buttons { min-height: 110px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    button { cursor: pointer; border: 0; border-radius: 999px; font-weight: 800; font-family: inherit; transition: transform .3s ease, font-size .3s ease, padding .3s ease, opacity .3s ease; }
    #yes { background: #f34c91; color: #fff; padding: 16px 32px; font-size: 20px; box-shadow: 0 7px 20px #f34c9155; }
    #no { background: #f1e6eb; color: #8d5670; padding: 16px 30px; font-size: 20px; }
    #yes:hover { filter: brightness(1.06); }
    .message { display: none; font-size: clamp(24px, 5vw, 34px); font-weight: 800; line-height: 1.55; }
    .message .emoji { font-size: 70px; }
    .float { position: fixed; bottom: -40px; opacity: .35; animation: rise linear infinite; pointer-events: none; }
    @keyframes beat { 50% { transform: scale(1.16); } }
    @keyframes rise { to { transform: translateY(-115vh) rotate(35deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="card">
    <div id="question">
      <div class="heart">💗</div>
      <h1>Anh có yêu em không?</h1>
      <div class="buttons">
        <button id="yes" type="button">Có ❤️</button>
        <button id="no" type="button">Không 💔</button>
      </div>
    </div>
    <div id="message" class="message" role="status"><div class="emoji">🥰💞</div>Em biết màaa!<br>Em cũng yêu anh nhiều lắm ❤️</div>
  </div>
  <script>
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    let noClicks = 0;
    no.addEventListener('click', () => {
      noClicks++;
      if (noClicks >= 6) { no.remove(); }
      else {
        const ratio = 1 - noClicks / 6;
        no.style.fontSize = `${Math.max(8, 20 * ratio)}px`;
        no.style.padding = `${Math.max(4, 16 * ratio)}px ${Math.max(7, 30 * ratio)}px`;
        no.style.opacity = String(Math.max(.25, ratio));
      }
      yes.style.fontSize = `${20 + noClicks * 4}px`;
      yes.style.padding = `${16 + noClicks * 2}px ${32 + noClicks * 5}px`;
    });
    yes.addEventListener('click', () => {
      document.getElementById('question').style.display = 'none';
      document.getElementById('message').style.display = 'block';
    });
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('span');
      el.className = 'float'; el.textContent = i % 2 ? '💕' : '💗';
      el.style.left = `${Math.random() * 100}%`;
      el.style.animationDuration = `${7 + Math.random() * 7}s`;
      el.style.animationDelay = `${Math.random() * -14}s`;
      el.style.fontSize = `${14 + Math.random() * 20}px`;
      document.body.appendChild(el);
    }
  </script>
</body>
</html>
